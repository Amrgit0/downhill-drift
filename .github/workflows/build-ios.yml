name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and add iOS
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Build Xcode archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DownhillDrift.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package .ipa
        run: |
          mkdir -p build/ipa_root/Payload
          cp -R build/DownhillDrift.xcarchive/Products/Applications/App.app build/ipa_root/Payload/
          (cd build/ipa_root && zip -qry ../DownhillDrift.ipa Payload)

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownhillDrift-ipa
          path: build/DownhillDrift.ipa
